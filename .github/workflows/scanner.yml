# MACD-Divergenz-Scanner  v1.1.0
# Läuft täglich 00:10 UTC (= 02:10 MESZ / 01:10 MEZ), direkt nach dem
# Daily-Kerzenschluss. Montags wird zusätzlich der Weekly-Chart gescannt
# (das regelt das Skript selbst über TIMEFRAMES=auto).
name: MACD Divergenz Scanner

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      timeframes:
        description: "auto | D | W | D,W"
        required: false
        default: "auto"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python macd_divergence_scanner.py
        env:
          # --- Geheimnisse (unter Settings -> Secrets -> Actions anlegen) ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional, nur falls BingX ohne Key ablehnt (Secrets gleichnamig anlegen):
          BINGX_API_KEY:      ${{ secrets.BINGX_API_KEY }}
          BINGX_API_SECRET:   ${{ secrets.BINGX_API_SECRET }}

          # --- Steuerung ---
          TIMEFRAMES: ${{ github.event.inputs.timeframes || 'auto' }}
          EXCHANGE:   "auto"      # auto | bingx | bybit | binance-futures | binance-spot
          TOP_N:      "100"       # wie viele Coins (nach 24h-Umsatz)

          # --- Divergenz-Tuning ---
          MACD_SOURCE:    "line"  # line = MACD-Linie, hist = Histogramm
          PIVOT_LEFT:     "5"     # Kerzen links vom Pivot
          PIVOT_RIGHT:    "3"     # Kerzen rechts zur Bestätigung (Daily)
          PIVOT_RIGHT_W:  "1"     # dito für Weekly (3 wären 3 Wochen Verzug)
          MIN_PIVOT_DIST: "5"     # Mindestabstand der beiden Pivots
          MAX_PIVOT_DIST: "60"    # Maximalabstand der beiden Pivots

          # --- Signalstärke (gegen Rausch-Treffer) ---
          MIN_PRICE_DIFF_PCT: "1.0"   # Pivot-Preise müssen sich um X % unterscheiden
          MIN_OSC_DIFF_PCT:   "10.0"  # MACD-Werte müssen sich um X % unterscheiden

          DETECT_HIDDEN:  "false" # versteckte Divergenzen auch melden
          ALERT_WINDOW:   "1"     # 1 = nur frisch bestätigte Pivots (kein Doppel-Alert)
          SEND_SUMMARY:   "true"  # auch melden, wenn nichts gefunden wurde
          CLUSTER_HINT:   "8"     # ab X gleichgerichteten Treffern: Schub-Hinweis (0 = aus)
